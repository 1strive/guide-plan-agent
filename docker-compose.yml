services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: test
      POSTGRES_DB: guide_plan
    ports:
      - '5433:5432'
    volumes:
      - guide_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U root -d guide_plan']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Task 5.4 — Redis 热层：承担事件流高频 append + Pub/Sub 跨进程广播预留
  # 端口映射 6380:6379，避开本机已有 Redis(6379)冲突
  # AOF everysec：宕机最多丢 1 秒事件，业务可接受(用户重发即可)
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - '6380:6379'
    volumes:
      - guide_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  guide_pg:
  guide_redis:
