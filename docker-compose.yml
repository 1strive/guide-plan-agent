services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: test
      MYSQL_DATABASE: guide_plan
    ports:
      - '3307:3306'
    volumes:
      - guide_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-ptest']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Task 5.4 — Redis 热层：承担 agent_run_events 高频 append + Pub/Sub 跨进程广播预留
  # 端口映射 6380:6379，避开本机已有 Redis(6379)冲突
  # AOF everysec：宕机最多丢 1 秒事件，业务可接受(用户重发即可)
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - '6380:6379'
    volumes:
      - guide_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  guide_data:
  guide_redis:
