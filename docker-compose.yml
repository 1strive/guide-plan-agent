services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: test
      MYSQL_DATABASE: guide_plan
    ports:
      - '3307:3306'
    volumes:
      - guide_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-ptest']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # 阶段3 Task 3.2:Chroma 向量数据库,HNSW 索引内置,跟 chromadb JS client 配套
  chroma:
    image: chromadb/chroma:latest
    ports:
      - '8000:8000'
    volumes:
      - chroma_data:/data
    environment:
      IS_PERSISTENT: 'TRUE'
      PERSIST_DIRECTORY: /data
      ANONYMIZED_TELEMETRY: 'FALSE'

volumes:
  guide_data:
  chroma_data:
